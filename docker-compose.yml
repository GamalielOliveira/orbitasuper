services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: daki
      POSTGRES_PASSWORD: daki_dev
      POSTGRES_DB: daki
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  dbdata:
